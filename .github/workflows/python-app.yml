# PR / push 校验流水线：lint + 测试 + 按 spec 构建验证（不发布）。
# Release 的创建与资产上传统一由 auto-release.yml 负责。
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 与 auto-release.yml 保持一致的版本区间
        pip install "flake8>=7.0,<8" "pyinstaller>=6.10,<7"
        if (Test-Path requirements.txt) { pip install -r requirements.txt }
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run tests
      run: |
        python -m unittest discover tests -v

    - name: Build with PyInstaller
      run: |
        # 打包参数统一收敛在 MiniTools.spec，PR 上验证 spec 可正常构建
        pyinstaller MiniTools.spec

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MiniTools
        path: ./dist/MiniTools.exe
