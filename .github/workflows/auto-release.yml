# This workflow will automatically create a release on every push to master branch
# and upload the built executable as a release asset

name: Auto Release

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed to get commit history for versioning

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 构建工具固定大版本区间：PyInstaller 大版本升级曾数次引入破坏性变更，
        # 不固定会让发布流水线在某次 CI 缓存刷新后突然挂掉
        pip install "flake8>=7.0,<8" "pyinstaller>=6.10,<7"
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run tests
      run: |
        python -m unittest discover tests -v

    - name: Generate version number
      id: version
      shell: pwsh
      run: |
        # 版本号定义在 app/__init__.py 的 __version__（setup.py 已删除）
        $version = (python -c "from app import __version__; print(__version__)")
        # Get commit count
        $commitCount = git rev-list --count HEAD
        # Create version string
        $newVersion = "$version.$commitCount"
        # 注入真实版本号到 app/__init__.py。必须在 PyInstaller 打包之前执行，
        # 否则 exe 内置的 __version__ 始终是 1.0.0，而 GitHub latest 是 1.0.0.<N>，
        # 每次启动都会误判有新版本而反复提示更新。
        Set-Content -Path app/__init__.py -Value "__version__ = '$newVersion'"
        Write-Host "Injected version: $newVersion"
        # ::set-output 已被 GitHub 禁用，使用 $GITHUB_OUTPUT 写 step 输出
        "version=$newVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Check if release tag already exists
      id: check_release
      shell: pwsh
      run: |
        # amend/force-push 不会改变 commit count，可能生成与已发布版本相同的 tag。
        # 若 tag 已存在则跳过 release 创建，避免 Create Release 因同名 tag 失败。
        $tag = "v${{ steps.version.outputs.version }}"
        $exists = (git ls-remote --tags origin | Select-String -Pattern ([regex]::Escape($tag)) -Quiet)
        if ($exists) {
          Write-Host "Tag $tag already exists, skipping release creation."
          "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        } else {
          Write-Host "Tag $tag does not exist yet, will create release."
          "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        }

    - name: Build with PyInstaller
      if: steps.check_release.outputs.exists == 'false'
      run: |
        # 打包参数统一收敛在 MiniTools.spec（datas: images + ascii_animations，
        # onefile/windowed/icon 均在 spec 内定义），CI 与本地构建共用同一入口，
        # 避免命令行参数与 spec 双份维护漂移
        pyinstaller MiniTools.spec

    - name: Generate changelog
      id: changelog
      shell: pwsh
      run: |
        # 获取上一个 tag
        $prevTag = git describe --tags --abbrev=0 HEAD^ 2>$null
        if ($LASTEXITCODE -ne 0) {
          # 没有上一个 tag，取所有提交
          $prevTag = ""
        }
        Write-Host "Previous tag: $prevTag"

        if ($prevTag) {
          $range = "$prevTag..HEAD"
        } else {
          $range = "HEAD"
        }

        # 生成 changelog：按类型分类
        # feat: 新功能, fix: 修复, refactor: 重构, docs: 文档, chore: 杂项
        $log = git log $range --pretty=format:"%s" --no-merges
        $lines = $log -split "`n"

        $feat = @()
        $fix = @()
        $refactor = @()
        $other = @()

        foreach ($line in $lines) {
          $line = $line.Trim()
          if ($line -match '^(feat|feature)(\(.+\))?:\s*(.+)') {
            $feat += "- $($Matches[3])"
          } elseif ($line -match '^(fix|bugfix)(\(.+\))?:\s*(.+)') {
            $fix += "- $($Matches[3])"
          } elseif ($line -match '^(refactor)(\(.+\))?:\s*(.+)') {
            $refactor += "- $($Matches[3])"
          } else {
            $other += "- $line"
          }
        }

        $body = ""
        if ($feat.Count -gt 0) {
          $body += "## New Features`n`n$($feat -join "`n")`n`n"
        }
        if ($fix.Count -gt 0) {
          $body += "## Bug Fixes`n`n$($fix -join "`n")`n`n"
        }
        if ($refactor.Count -gt 0) {
          $body += "## Refactoring`n`n$($refactor -join "`n")`n`n"
        }
        if ($other.Count -gt 0) {
          $body += "## Other Changes`n`n$($other -join "`n")`n`n"
        }

        $body += "---`n"
        $body += "**Commit:** ${{ github.sha }}`n"
        $body += "**Author:** ${{ github.actor }}`n"

        # 写入文件避免转义问题
        $body | Out-File -FilePath changelog.md -Encoding utf8 -NoNewline
        Write-Host "Changelog generated:"
        Write-Host $body

    - name: Create GitHub Release
      if: steps.check_release.outputs.exists == 'false'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # actions/create-release / upload-release-asset 已被官方归档弃用，
        # 统一改用预装的 gh CLI 一步创建 release 并上传 exe 资产
        $tag = "v${{ steps.version.outputs.version }}"
        gh release create $tag "./dist/MiniTools.exe#MiniTools.exe" `
          --title "Release $tag" `
          --notes-file changelog.md
