# This workflow will automatically create a release on every push to master branch
# and upload the built executable as a release asset

name: Auto Release

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed to get commit history for versioning

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run tests
      run: |
        python -m unittest discover tests -v

    - name: Generate version number
      id: version
      run: |
        # Get current version from package metadata (avoid importing setup.py,
        # which runs setup() and exits the process)
        $version = (python -c "from app import __version__; print(__version__)")
        # Get commit count
        $commitCount = git rev-list --count HEAD
        # Create version string
        $newVersion = "$version.$commitCount"
        # 注入真实版本号到 app/__init__.py。必须在 PyInstaller 打包之前执行，
        # 否则 exe 内置的 __version__ 始终是 1.0.0，而 GitHub latest 是 1.0.0.<N>，
        # 每次启动都会误判有新版本而反复提示更新。
        Set-Content -Path app/__init__.py -Value "__version__ = '$newVersion'"
        Write-Host "Injected version: $newVersion"
        echo "::set-output name=version::$newVersion"

    - name: Build with PyInstaller
      run: |
        # --add-data 必须带上 images 目录，否则 exe 运行时找不到托盘图标和宠物图片
        pyinstaller --onefile --windowed --name MiniTools --add-data "images;images" main.py

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version.outputs.version }}
        release_name: Release v${{ steps.version.outputs.version }}
        body: |
          Automated release for commit ${{ github.sha }}
          - Built on ${{ runner.os }}
          - Commit: ${{ github.sha }}
          - Author: ${{ github.actor }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/MiniTools.exe
        asset_name: MiniTools.exe
        asset_content_type: application/octet-stream
